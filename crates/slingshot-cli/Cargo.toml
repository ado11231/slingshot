[package]
name = "slingshot-cli"
description = "Use the CPU, RAM, and GPU of a powerful machine from your laptop, in your own editor and terminal"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

# The package is slingshot-cli, but the program it produces is called slingshot, with sling
# as its short name. Both run the code in lib.rs.
[[bin]]
name = "slingshot"
path = "src/main.rs"

[[bin]]
name = "sling"
path = "src/bin/sling.rs"

[dependencies]
slingshot-core = { path = "../slingshot-core", version = "0.1.0" }
slingshot-agent = { path = "../slingshot-agent", version = "0.1.0" }
anyhow = { workspace = true }
iroh = { workspace = true }
clap = { workspace = true }
crossterm = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shell-words = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
